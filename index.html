<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loc'APE - Gestion des Locations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-indigo-700 text-white shadow-md p-6">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Loc'APEL école St Anne-Casson</h1>
                <p class="text-indigo-100 italic">Réservez, louez, aidez l'école !</p>
            </div>
            <div id="connectionStatus" class="text-xs bg-indigo-800 p-2 rounded text-indigo-200">
                <i class="fas fa-database mr-1"></i> Connexion base de données...
            </div>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4 grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm min-h-[400px]">
                <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-2">Inventaire disponible</h2>
                <div class="grid md:grid-cols-2 gap-6" id="inventory">
                    <p class="text-gray-400">Chargement du matériel...</p>
                </div>
            </div>
        </div>

        <aside class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500 sticky top-6">
                <h2 class="text-xl font-bold mb-4">Récapitulatif</h2>
                
                <div id="panierList" class="space-y-3 mb-6 max-h-60 overflow-y-auto border-b pb-4">
                    <p class="text-gray-400 italic text-center">Aucun article sélectionné</p>
                </div>

                <div class="space-y-2 mb-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Total Location :</span>
                        <span id="totalPrix" class="font-bold">0.00 €</span>
                    </div>
                    <div class="flex justify-between text-orange-600 bg-orange-50 p-2 rounded">
                        <span class="text-sm">Caution à prévoir :</span>
                        <span id="totalCaution" class="font-bold">0.00 €</span>
                    </div>
                </div>

                <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-3 text-sm flex items-center">
                        <i class="fas fa-user-edit mr-2 text-indigo-500"></i> Informations de location
                    </h3>
                    <div class="grid grid-cols-1 gap-3">
                        <input type="text" id="nom_loueur" placeholder="Nom et Prénom du loueur" class="p-2 border rounded text-sm w-full focus:ring-2 focus:ring-indigo-500 outline-none">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <input type="email" id="email_loueur" placeholder="Adresse email" class="p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <input type="tel" id="tel_loueur" placeholder="Téléphone" class="p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div class="flex flex-col">
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Début</label>
                                <input type="date" id="date_debut" class="p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="flex flex-col">
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Fin</label>
                                <input type="date" id="date_fin" class="p-2 border rounded text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AJOUT DE L'ID btnSubmit ICI -->
                <button id="btnSubmit" onclick="confirmerReservation()" class="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 shadow-lg transition transform active:scale-95">
                    Confirmer la réservation
                </button>
            </div>
        </aside>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://uofkzlgqryxhjaovidqf.supabase.co' 
        // NOTE: Verifie bien que cette clé est la "anon public" eyJhbG... si ca ne connecte toujours pas
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZmt6bGdxcnl4aGphb3ZpZHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzUzNzAsImV4cCI6MjA5MzA1MTM3MH0.PO7vsGf8IfgnhRvegxfrCMDrYU5qhcBW8C789RCq0i8'
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        let panier = [];
        let itemsData = [];

        async function fetchMateriels() {
            try {
                const { data, error } = await supabase.from('materiels').select('*');
                if (error) throw error;
                itemsData = data;
                renderInventory();
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-check-circle text-green-400"></i> Connecté à Supabase';
            } catch (err) {
                console.error(err);
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-exclamation-triangle text-red-400"></i> Erreur de connexion';
            }
        }

        function renderInventory() {
            const container = document.getElementById('inventory');
            container.innerHTML = itemsData.map(item => `
                <div class="border rounded-lg overflow-hidden flex flex-col bg-white shadow-sm">
                    <div class="h-40 bg-gray-100 relative">
                        <img src="${item.image_url || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-green-500 text-white text-[10px] px-2 py-1 rounded font-bold uppercase">
                            Stock : ${item.stock_total}
                        </span>
                    </div>
                    <div class="p-4 flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="font-bold text-gray-800">${item.nom}</h3>
                            <p class="text-xs text-gray-500 mb-2">${item.description || ''}</p>
                            <p class="text-indigo-600 font-bold">${item.prix.toFixed(2)} €</p>
                        </div>
                        <div class="mt-4 flex gap-2">
                            <input type="number" id="qty-${item.id}" min="1" max="${item.stock_total}" value="1" class="w-12 border rounded text-center text-sm border-indigo-100">
                            <button onclick="ajouterAuPanier(${item.id})" class="flex-1 bg-indigo-600 text-white text-xs py-2 rounded font-bold">Ajouter</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

       window.ajouterAuPanier = (id) => {
            const item = itemsData.find(i => i.id === id);
            const qtyInput = document.getElementById(`qty-${id}`);
            const qtySouhaitee = parseInt(qtyInput.value);
            const index = panier.findIndex(p => p.id === id);
            const qtyDejaDansPanier = index > -1 ? panier[index].qty : 0;
            const totalApresAjout = qtyDejaDansPanier + qtySouhaitee;

            if (totalApresAjout > item.stock_total) {
                const restePossible = item.stock_total - qtyDejaDansPanier;
                if (restePossible > 0) {
                    alert(`Limite atteinte ! Vous avez déjà ${qtyDejaDansPanier} article(s). Max restant : ${restePossible}`);
                } else {
                    alert(`Désolé, tout le stock disponible est déjà dans votre panier.`);
                }
                return;
            }

            if (index > -1) {
                panier[index].qty = totalApresAjout;
            } else {
                panier.push({ ...item, qty: qtySouhaitee });
            }
            majPanier();
        };

        window.supprimerItem = (index) => {
            panier.splice(index, 1);
            majPanier();
        };

        function majPanier() {
            const container = document.getElementById('panierList');
            let totalP = 0; let totalC = 0;
            if (panier.length === 0) {
                container.innerHTML = '<p class="text-gray-400 italic text-center py-4">Le panier est vide</p>';
            } else {
                container.innerHTML = panier.map((item, index) => {
                    totalP += (item.qty * item.prix);
                    totalC += (item.qty * (item.caution_unitaire || 0)); 
                    return `<div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded border border-gray-100">
                        <span>${item.qty}x ${item.nom}</span>
                        <div class="flex items-center gap-2">
                            <span class="font-bold">${(item.qty * item.prix).toFixed(2)}€</span>
                            <button onclick="supprimerItem(${index})" class="text-red-400"><i class="fas fa-times"></i></button>
                        </div>
                    </div>`;
                }).join('');
            }
            document.getElementById('totalPrix').innerText = totalP.toFixed(2) + " €";
            document.getElementById('totalCaution').innerText = totalC.toFixed(2) + " €";
        }

        window.confirmerReservation = async () => {
            const btn = document.getElementById('btnSubmit');
            const nom = document.getElementById('nom_loueur').value;
            const email = document.getElementById('email_loueur').value;
            const tel = document.getElementById('tel_loueur').value;
            const debut = document.getElementById('date_debut').value;
            const fin = document.getElementById('date_fin').value;
            const totalP = document.getElementById('totalPrix').innerText;
            const totalC = document.getElementById('totalCaution').innerText;

            if (!nom || !email || panier.length === 0) {
                return alert("Veuillez remplir les informations et choisir du matériel.");
            }

            btn.disabled = true;
            btn.innerText = "Génération du contrat...";

            const docDefinition = {
                pageSize: 'A4',
                pageMargins: [40, 40, 40, 40],
                content: [
                    { text: 'CONTRAT DE LOCATION - ECOLE SAINTE ANNE CASSON', style: 'mainTitle' },
                    { canvas: [{ type: 'line', x1: 0, y1: 5, x2: 515, y2: 5, lineWidth: 1.5 }] },
                    { text: '\n' },
                    {
                        columns: [
                            {
                                width: '*',
                                stack: [
                                    { text: 'OGEC SERVICE LOCATION', bold: true },
                                    { text: 'ECOLE SAINTE ANNE\n2 Rue du château\n44390 CASSON\nlocation.ecolesteanne@gmail.com', fontSize: 9 }
                                ]
                            },
                            {
                                width: 200,
                                stack: [
                                    { text: nom, bold: true, alignment: 'right' },
                                    { text: `Tél : ${tel}`, alignment: 'right', fontSize: 9 },
                                    { text: `Mail : ${email}`, alignment: 'right', fontSize: 9 }
                                ],
                                margin: [0, 0, 0, 10]
                            }
                        ]
                    },
                    { text: '1- Date de Location:', style: 'sectionHeader' },
                    { text: `Date de départ : ${debut}       Date de retour : ${fin}`, margin: [10, 5, 0, 15], fontSize: 10 },
                    { text: '2- Matériels loués :', style: 'sectionHeader' },
                    {
                        table: {
                            headerRows: 1,
                            widths: ['*', 'auto', 'auto', 'auto', 'auto'],
                            body: [
                                [
                                    { text: 'Articles', style: 'tableHeader' },
                                    { text: 'Quantités', style: 'tableHeader', alignment: 'center' },
                                    { text: 'Caution/unités', style: 'tableHeader', alignment: 'right' },
                                    { text: 'Prix/unités', style: 'tableHeader', alignment: 'right' },
                                    { text: 'Prix Total', style: 'tableHeader', alignment: 'right' }
                                ],
                                ...panier.map(item => [
                                    { text: item.nom, fontSize: 9 },
                                    { text: item.qty.toString(), alignment: 'center', fontSize: 9 },
                                    { text: `${(item.caution_unitaire || 0).toFixed(2)} €`, alignment: 'right', fontSize: 9 },
                                    { text: `${item.prix.toFixed(2)} €`, alignment: 'right', fontSize: 9 },
                                    { text: `${(item.qty * item.prix).toFixed(2)} €`, alignment: 'right', bold: true, fontSize: 9 }
                                ])
                            ]
                        },
                        layout: 'lightHorizontalLines'
                    },
                    { text: '\n' },
                    {
                        table: {
                            widths: ['*'],
                            body: [[{
                                stack: [
                                    { text: '3- Montant à régler/Caution:', bold: true, fontSize: 10 },
                                    { text: `Montant Total à régler : ${totalP}`, margin: [0, 5, 0, 0] },
                                    { text: `Montant chèque de caution : ${totalC}`, bold: true }
                                ],
                                padding: [10, 10, 10, 10]
                            }]]
                        }
                    },
                    { text: '\n4- Etat du matériel:', style: 'sectionHeader' },
                    { text: 'Remarques/observations :', fontSize: 9, color: '#666', margin: [0, 5, 0, 0] },
                    { canvas: [{ type: 'rect', x: 0, y: 5, w: 515, h: 40, lineWidth: 0.5, lineColor: '#ccc' }] },
                    { text: '\n5- Conditions:', style: 'sectionHeader' },
                    {
                        ul: [
                            { text: 'Une caution sera demandée lors de la remise du matériel.', fontSize: 8 },
                            { text: 'La caution ne sera pas encaissée sauf détérioration.', fontSize: 8 },
                            { text: 'Le locataire est responsable du matériel.', fontSize: 8 },
                            { text: 'Le matériel devra être restitué propre.', fontSize: 8 }
                        ],
                        margin: [0, 5, 0, 10]
                    },
                    { text: 'CONFIRMATION REQUISE PAR OGEC', alignment: 'center', bold: true, fontSize: 9, margin: [0, 10, 0, 20] },
                    {
                        columns: [
                            { width: '*', stack: [{ text: 'Signature OGEC :', decoration: 'underline', fontSize: 10 }, { text: '\n\n\n' }] },
                            { width: '*', stack: [{ text: 'Signature loueur :', decoration: 'underline', fontSize: 10, alignment: 'right' }, { text: '\n\n\n' }] }
                        ]
                    }
                ],
                styles: {
                    mainTitle: { fontSize: 14, bold: true, alignment: 'center', margin: [0, 0, 0, 5] },
                    sectionHeader: { fontSize: 11, bold: true, background: '#e5e7eb', margin: [0, 15, 0, 5] },
                    tableHeader: { fontSize: 9, bold: true, fillColor: '#f3f4f6', margin: [0, 3, 0, 3] }
                }
            };

            try {
                const pdfDocGenerator = pdfMake.createPdf(docDefinition);
                pdfDocGenerator.download(`Contrat_${nom.replace(/ /g, '_')}.pdf`);

                pdfDocGenerator.getBlob(async (blob) => {
                    const fileName = `contrat_${Date.now()}_${nom.replace(/ /g, '_')}.pdf`;
                    const { data: storageData, error: storageError } = await supabase.storage.from('contrats').upload(fileName, blob);
                    
                    const { data: urlData } = supabase.storage.from('contrats').getPublicUrl(fileName);
                    await supabase.from('reservations').insert([{
                        nom_loueur: nom, email, telephone: tel,
                        date_debut: debut, date_fin: fin, articles: panier,
                        total_prix: parseFloat(totalP), total_caution: parseFloat(totalC),
                        pdf_url: urlData.publicUrl
                    }]);
                });

                const listeArticlesMail = panier.map(a => `- ${a.qty}x ${a.nom}`).join('<br>');
                await emailjs.send('service_63g35od', 'template_gb5d2wt', {
                    nom_loueur: nom, email_destinataire: email,
                    message_html: `<h3>Récapitulatif</h3><p>${listeArticlesMail}</p><p>Total: ${totalP}</p>`
                });

                document.getElementById('inventory').innerHTML = `<div class="col-span-full text-center p-10 bg-white rounded-xl shadow-lg"><h2 class="text-2xl font-bold text-green-600">Réservation terminée !</h2><button onclick="window.location.reload()" class="mt-6 bg-indigo-600 text-white px-8 py-3 rounded-lg">Retour</button></div>`;

            } catch (err) {
                console.error("Erreur globale:", err);
                alert("Une erreur est survenue.");
                btn.disabled = false;
            }
        }; // <--- CETTE ACCOLADE MANQUAIT ICI POUR FERMER confirmerReservation

        function creerLienGoogleCalendar(res) {
            const dDebut = res.date_debut.replace(/-/g, '');
            const dFin = res.date_fin.replace(/-/g, '');
            const titre = encodeURIComponent(`[LOC APE] ${res.nom_loueur}`);
            const list = res.articles.map(a => `- ${a.qty}x ${a.nom}`).join('\n');
            const desc = encodeURIComponent(`Loueur : ${res.nom_loueur}\nMatériel :\n${list}`);
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${titre}&dates=${dDebut}/${dFin}&details=${desc}&sf=true&output=xml`;
        }

        fetchMateriels();
    </script>
</body>
</html>

 async function calculerStockDisponible(materielId, stockTotal) {
    const debut = document.getElementById('date_debut').value;
    const fin = document.getElementById('date_fin').value;

    if (!debut || !fin) return stockTotal;

    // On récupère les réservations qui chevauchent ces dates
    const { data: reservations, error } = await supabase
        .from('reservations')
        .select('articles')
        .lte('date_debut', fin)
        .gte('date_fin', debut);

    if (error) {
        console.error("Erreur calcul stock:", error);
        return stockTotal;
    }

    // Calcul de la somme déjà réservée
    let dejaLoue = 0;
    reservations.forEach(res => {
        const art = res.articles.find(a => a.id === materielId);
        if (art) dejaLoue += art.qty;
    });

    return stockTotal - dejaLoue;
}

window.ajouterAuPanier = async (id) => {
    const item = itemsData.find(i => i.id === id);
    const qtyInput = document.getElementById(`qty-${id}`);
    const qtyDemandee = parseInt(qtyInput.value);
    // On cible le bouton précis qui a été cliqué
    const btn = document.querySelector(`button[onclick="ajouterAuPanier(${id})"]`);
    
    // 1. VERIFICATION DYNAMIQUE DU STOCK (Ta logique actuelle)
    const stockReel = await calculerStockDisponible(id, item.stock_total);

    if (qtyDemandee > stockReel) {
        alert(`Désolé ! Pour ces dates, il ne reste que ${stockReel} exemplaire(s) de "${item.nom}".`);
        return;
    }

    const index = panier.findIndex(p => p.id === id);
    if (index > -1) {
        if (panier[index].qty + qtyDemandee > stockReel) {
            alert("Limite de stock atteinte pour cette période avec vos articles déjà au panier.");
            return;
        }
        panier[index].qty += qtyDemandee;
    } else {
        panier.push({ ...item, qty: qtyDemandee });
    }
    
    // 2. MISE À JOUR DU PANIER CACHÉ (En bas sur mobile)
    majPanier();

    // 3. EFFET VISUEL (Feedback pour l'utilisateur)
    if (btn) {
        const originalText = btn.innerHTML;
        const originalClasses = btn.className;

        // On change l'apparence : Vert + Coche
        btn.innerHTML = '<i class="fas fa-check"></i> Ajouté !';
        // On retire les classes de couleur bleu/indigo de Tailwind pour mettre du vert
        btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
        btn.classList.add('bg-green-500');

        // Retour à l'état initial après 2 secondes
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('bg-green-500');
            btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
        }, 2000);
    }
    
    // Petit retour haptique (vibration) pour mobile si supporté
    if (window.navigator.vibrate) window.navigator.vibrate(50);
};

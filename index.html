<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loc'APEL école Sainte Anne - Location de matériel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
<header class="bg-indigo-700 text-white shadow-md p-6">
  <div class="container mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-3">
    <div>
      <h1 class="text-2xl font-bold">Loc'APEL école St Anne-Casson</h1>
      <p class="text-indigo-100 italic">Réservez, louez, amusez-vous ! Saisissez vos dates avant de remplir votre panier.</p>
    </div>
    <div id="connectionStatus" class="text-xs bg-indigo-800 p-2 rounded text-indigo-200 w-fit">
      <i class="fas fa-database mr-1"></i> Connexion base de données...
    </div>
  </div>
</header>

<main class="container mx-auto py-8 px-4 grid lg:grid-cols-3 gap-8">
  <section class="lg:col-span-2 space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-sm min-h-[400px]">
      <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-2">Inventaire disponible</h2>
      <div class="grid md:grid-cols-2 gap-6" id="inventory">
        <p class="text-gray-400">Chargement du matériel...</p>
      </div>
    </div>
  </section>

  <aside class="space-y-6">
    <div class="bg-white p-5 rounded-xl shadow-lg border-t-4 border-indigo-500 sticky top-6">
      <h2 class="text-xl font-bold mb-3">Récapitulatif</h2>
      <div id="panierList" class="space-y-2 mb-4 max-h-40 overflow-y-auto border-b pb-2">
        <p class="text-gray-400 italic text-center text-sm">Aucun article sélectionné</p>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-4">
        <div class="bg-gray-50 p-2 rounded text-center">
          <span class="text-[10px] text-gray-500 uppercase block">Total</span>
          <span id="totalPrix" class="font-bold text-sm">0.00 €</span>
        </div>
        <div class="bg-orange-50 p-2 rounded text-center">
          <span class="text-[10px] text-orange-500 uppercase block">Caution</span>
          <span id="totalCaution" class="font-bold text-sm text-orange-600">0.00 €</span>
        </div>
      </div>

      <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
        <h3 class="font-bold text-gray-700 mb-2 text-[11px] uppercase flex items-center">
          <i class="fas fa-user-edit mr-2 text-indigo-500"></i> Vos informations
        </h3>
        <div class="space-y-2">
          <input type="text" id="nom_loueur" maxlength="120" placeholder="Nom et prénom (obligatoire)" class="p-2 border rounded text-xs w-full outline-none">
          <input type="text" id="adresse_loueur" maxlength="180" placeholder="Adresse (obligatoire)" class="p-2 border rounded text-xs w-full outline-none">
          <div class="grid grid-cols-5 gap-2">
            <input type="text" id="cp_loueur" maxlength="12" placeholder="CP" class="col-span-2 p-2 border rounded text-xs outline-none">
            <input type="text" id="ville_loueur" maxlength="120" placeholder="Ville" class="col-span-3 p-2 border rounded text-xs outline-none">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="email" id="email_loueur" maxlength="180" placeholder="Email" class="p-2 border rounded text-xs outline-none">
            <input type="tel" id="tel_loueur" maxlength="40" placeholder="Téléphone" class="p-2 border rounded text-xs outline-none">
          </div>
          <div class="hidden" aria-hidden="true">
            <label>Site web <input type="text" id="website" tabindex="-1" autocomplete="off"></label>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-gray-200">
            <div>
              <label class="text-[9px] font-bold text-gray-400 uppercase">Début</label>
              <input type="date" id="date_debut" class="w-full p-1 border rounded text-[11px] outline-none">
            </div>
            <div>
              <label class="text-[9px] font-bold text-gray-400 uppercase">Fin</label>
              <input type="date" id="date_fin" class="w-full p-1 border rounded text-[11px] outline-none">
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4 p-3 bg-indigo-50 rounded-lg border border-indigo-100">
        <label class="flex items-start cursor-pointer">
          <input type="checkbox" id="rgpd_consent" class="mt-1 mr-3 h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
          <span class="text-[11px] text-gray-700 leading-tight">
            J'accepte que les données saisies soient utilisées par l'APEL Ste Anne pour la gestion de ma réservation et l'établissement du contrat.
            Consultez notre <a href="rgpd.html" target="_blank" rel="noopener" class="text-indigo-600 underline">politique de confidentialité</a>.
          </span>
        </label>
      </div>

      <button id="btnSubmit" class="w-full mt-4 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 shadow shadow-green-200 transition active:scale-95 text-sm">
        Confirmer la réservation
      </button>
    </div>
  </aside>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://uofkzlgqryxhjaovidqf.supabase.co',
  'sb_publishable_3yWGD_MoqP-6jHeHbbIM5w_kphGAJ2F'
);

let panier = [];
let itemsData = [];
let disponibilites = {};
const inventory = document.getElementById('inventory');
const inputDebut = document.getElementById('date_debut');
const inputFin = document.getElementById('date_fin');
const today = new Date().toISOString().slice(0, 10);
inputDebut.min = today;
inputFin.min = today;

const escapeHtml = (value) => String(value ?? '')
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#039;');

const safeImageUrl = (value) => {
  try {
    const url = new URL(String(value || ''));
    return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
  } catch { return ''; }
};

function clearPanierOnDateChange() {
  if (panier.length) {
    panier = [];
    majPanier();
  }
}

inputDebut.addEventListener('change', async () => {
  inputFin.min = inputDebut.value || today;
  if (inputFin.value && inputFin.value < inputDebut.value) inputFin.value = inputDebut.value;
  clearPanierOnDateChange();
  await refreshDisponibilites();
});
inputFin.addEventListener('change', async () => {
  clearPanierOnDateChange();
  await refreshDisponibilites();
});

async function fetchMateriels() {
  try {
    const { data, error } = await supabase
      .from('materiels')
      .select('id, nom, description, prix, caution_unitaire, stock_total, image_url')
      .order('nom');
    if (error) throw error;
    itemsData = data || [];
    document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-check-circle text-green-400"></i> Connecté';
    renderInventory();
  } catch (error) {
    console.error(error);
    inventory.innerHTML = '<p class="text-red-500">Impossible de charger le matériel.</p>';
    document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-exclamation-triangle text-red-400"></i> Erreur';
  }
}

async function refreshDisponibilites() {
  const debut = inputDebut.value;
  const fin = inputFin.value;
  disponibilites = {};
  if (!debut || !fin || fin < debut) {
    renderInventory();
    return;
  }
  try {
    const response = await fetch(`/.netlify/functions/disponibilites?debut=${encodeURIComponent(debut)}&fin=${encodeURIComponent(fin)}`, { cache: 'no-store' });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || 'Erreur disponibilité');
    disponibilites = payload.disponibilites || {};
    renderInventory();
  } catch (error) {
    console.error(error);
    alert('Impossible de vérifier les disponibilités pour le moment.');
    renderInventory();
  }
}

function renderInventory() {
  const datesOK = inputDebut.value && inputFin.value && inputFin.value >= inputDebut.value;
  inventory.innerHTML = itemsData.map((item) => {
    const stockDispo = datesOK ? Number(disponibilites[String(item.id)] ?? 0) : Number(item.stock_total || 0);
    const indisponible = datesOK && stockDispo <= 0;
    const badge = !datesOK ? `STOCK TOTAL : ${item.stock_total}` : indisponible ? 'INDISPONIBLE' : `DISPONIBLE : ${stockDispo}`;
    const badgeClass = !datesOK ? 'bg-green-500' : indisponible ? 'bg-red-600' : 'bg-blue-600';
    const imageUrl = safeImageUrl(item.image_url);
    const image = imageUrl
      ? `<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(item.nom)}" class="max-w-full max-h-full object-contain transition-transform duration-300 hover:scale-105">`
      : '<div class="text-gray-300 flex flex-col items-center"><i class="fas fa-image text-4xl"></i><span class="text-[10px] mt-2">Aucun visuel</span></div>';

    return `<article class="border rounded-lg overflow-hidden flex flex-col bg-white shadow-sm transition-all hover:shadow-md ${indisponible ? 'opacity-75' : ''}">
      <div class="h-48 bg-gray-50 relative flex items-center justify-center p-4 border-b">
        ${image}
        <span class="absolute top-2 right-2 ${badgeClass} text-white text-[10px] px-2 py-1 rounded font-bold uppercase shadow-sm">${escapeHtml(badge)}</span>
      </div>
      <div class="p-4 flex flex-col justify-between flex-grow">
        <div>
          <h3 class="font-bold text-gray-800 leading-tight">${escapeHtml(item.nom)}</h3>
          <p class="text-gray-500 text-[11px] mt-2 line-clamp-2 italic leading-snug">${escapeHtml(item.description || 'Pas de description détaillée.')}</p>
          <p class="text-indigo-600 font-bold mt-3 text-lg">${Number(item.prix || 0).toFixed(2)} €</p>
        </div>
        <div class="mt-4 flex gap-2">
          <input type="number" id="qty-${item.id}" min="1" max="${stockDispo}" value="1" ${!datesOK || indisponible ? 'disabled' : ''} class="w-14 border rounded text-center text-sm">
          <button data-add="${item.id}" ${!datesOK || indisponible ? 'disabled' : ''} class="flex-1 text-white text-xs py-2 rounded font-bold ${!datesOK ? 'bg-gray-400 cursor-not-allowed' : indisponible ? 'bg-red-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'}">
            ${!datesOK ? 'Saisir dates' : indisponible ? 'Indisponible' : 'Ajouter'}
          </button>
        </div>
      </div>
    </article>`;
  }).join('') || '<p class="text-gray-400">Aucun matériel disponible.</p>';
}

inventory.addEventListener('click', (event) => {
  const button = event.target.closest('[data-add]');
  if (!button) return;
  const id = Number(button.dataset.add);
  const item = itemsData.find((i) => Number(i.id) === id);
  const qty = Number(document.getElementById(`qty-${id}`).value);
  const stock = Number(disponibilites[String(id)] ?? 0);
  if (!item || !Number.isInteger(qty) || qty < 1) return;
  const existing = panier.find((p) => Number(p.id) === id);
  const totalQty = (existing?.qty || 0) + qty;
  if (totalQty > stock) return alert(`Il ne reste que ${stock} exemplaire(s) pour ces dates.`);
  if (existing) existing.qty = totalQty;
  else panier.push({ ...item, qty });
  majPanier();
  button.innerHTML = '<i class="fas fa-check"></i> Ajouté !';
  setTimeout(renderInventory, 900);
});

function majPanier() {
  const container = document.getElementById('panierList');
  let totalPrix = 0;
  let totalCaution = 0;
  if (!panier.length) {
    container.innerHTML = '<p class="text-gray-400 italic text-center text-sm">Aucun article sélectionné</p>';
  } else {
    container.innerHTML = panier.map((item, index) => {
      totalPrix += item.qty * Number(item.prix || 0);
      totalCaution += item.qty * Number(item.caution_unitaire || 0);
      return `<div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded"><span>${item.qty}x ${escapeHtml(item.nom)}</span><button data-remove="${index}" class="text-red-500" aria-label="Supprimer"><i class="fas fa-times"></i></button></div>`;
    }).join('');
  }
  document.getElementById('totalPrix').textContent = `${totalPrix.toFixed(2)} €`;
  document.getElementById('totalCaution').textContent = `${totalCaution.toFixed(2)} €`;
}

document.getElementById('panierList').addEventListener('click', (event) => {
  const button = event.target.closest('[data-remove]');
  if (!button) return;
  panier.splice(Number(button.dataset.remove), 1);
  majPanier();
});

function formInfo() {
  return {
    nom: document.getElementById('nom_loueur').value.trim(),
    adresse: document.getElementById('adresse_loueur').value.trim(),
    cp: document.getElementById('cp_loueur').value.trim(),
    ville: document.getElementById('ville_loueur').value.trim(),
    email: document.getElementById('email_loueur').value.trim(),
    tel: document.getElementById('tel_loueur').value.trim(),
    debutISO: inputDebut.value,
    finISO: inputFin.value,
    debut: inputDebut.value.split('-').reverse().join('/'),
    fin: inputFin.value.split('-').reverse().join('/')
  };
}

function buildPdf(info) {
  const totalP = panier.reduce((sum, i) => sum + i.qty * Number(i.prix || 0), 0);
  const totalC = panier.reduce((sum, i) => sum + i.qty * Number(i.caution_unitaire || 0), 0);
  return {
    pageSize: 'A4', pageMargins: [40, 40, 40, 40],
    content: [
      { text: 'CONTRAT DE LOCATION - ECOLE SAINTE ANNE CASSON', style: 'mainTitle' },
      { canvas: [{ type: 'line', x1: 0, y1: 5, x2: 515, y2: 5, lineWidth: 1.5 }] }, { text: '\n' },
      { columns: [
        { width: '*', stack: ['OGEC SERVICE LOCATION', 'ECOLE SAINTE ANNE', '2 Rue du château', '44390 CASSON', 'loc.ecolesteanne@gmail.com'], fontSize: 9 },
        { width: 210, stack: [{ text: info.nom, bold: true }, info.adresse, `${info.cp} ${info.ville}`, `Tél : ${info.tel}`, `Mail : ${info.email}`], alignment: 'right', fontSize: 9 }
      ]},
      { text: '\n1- Date de location :', style: 'sectionHeader' },
      { text: `Date de départ : ${info.debut}       Date de retour : ${info.fin}`, margin: [10, 5, 0, 15], fontSize: 10 },
      { text: '2- Matériels loués :', style: 'sectionHeader' },
      { table: { headerRows: 1, widths: ['*', 'auto', 'auto', 'auto'], body: [
        [{ text: 'Articles', style: 'tableHeader' }, { text: 'Quantités', style: 'tableHeader' }, { text: 'Caution/u', style: 'tableHeader' }, { text: 'Prix total', style: 'tableHeader' }],
        ...panier.map((i) => [i.nom, String(i.qty), `${Number(i.caution_unitaire || 0).toFixed(2)} €`, `${(i.qty * Number(i.prix || 0)).toFixed(2)} €`])
      ]}, layout: 'lightHorizontalLines' },
      { text: '\n3- Montant à régler / caution :', style: 'sectionHeader' },
      { text: `Montant total à régler : ${totalP.toFixed(2)} €\nMontant du chèque de caution : ${totalC.toFixed(2)} €`, margin: [10, 5, 0, 10] },
      { text: '4- Etat du matériel :', style: 'sectionHeader' },
      { text: 'Remarques / observations :', fontSize: 9, color: '#666' },
      { canvas: [{ type: 'rect', x: 0, y: 5, w: 515, h: 40, lineWidth: 0.5, lineColor: '#ccc' }] },
      { text: '\n5- Conditions :', style: 'sectionHeader' },
      { ul: [
        { text: 'Une caution sera demandée lors de la remise du matériel.', fontSize: 8 },
        { text: 'La caution ne sera pas encaissée sauf en cas de détérioration, perte ou non-restitution du matériel.', fontSize: 8 },
        { text: 'Le locataire est responsable du matériel pendant toute la durée de la location.', fontSize: 8 },
        { text: 'Le matériel devra être restitué complet, propre et en bon état.', fontSize: 8 }
      ]},
      { text: "CE CONTRAT NE FAIT FOI QU'APRÈS CONFIRMATION PAR MAIL OU TÉLÉPHONE DE LA PART DE L'OGEC", alignment: 'center', bold: true, fontSize: 10, margin: [0, 15, 0, 20] },
      { columns: [{ text: 'Signature OGEC :\n\n', decoration: 'underline' }, { text: 'Signature loueur :\n\n', decoration: 'underline', alignment: 'right' }] }
    ],
    styles: {
      mainTitle: { fontSize: 14, bold: true, alignment: 'center' },
      sectionHeader: { fontSize: 11, bold: true, background: '#e5e7eb', margin: [0, 15, 0, 5] },
      tableHeader: { fontSize: 9, bold: true, fillColor: '#f3f4f6' }
    }
  };
}

function pdfToBase64(docDefinition) {
  return new Promise((resolve) => pdfMake.createPdf(docDefinition).getBase64(resolve));
}

document.getElementById('btnSubmit').addEventListener('click', async () => {
  const info = formInfo();
  if (!info.debutISO || !info.finISO || info.finISO < info.debutISO || info.debutISO < today) return alert('Veuillez saisir une période valide.');
  if (!document.getElementById('rgpd_consent').checked) return alert("Vous devez accepter l'utilisation de vos données.");
  if (!info.nom || !info.adresse || !info.cp || !info.ville || !info.email || !info.tel) return alert('Veuillez remplir tous les champs obligatoires.');
  if (!panier.length) return alert('Votre panier est vide.');

  const button = document.getElementById('btnSubmit');
  button.disabled = true;
  button.textContent = 'Génération et envoi en cours...';

  try {
    const pdfBase64 = await pdfToBase64(buildPdf(info));
    const response = await fetch('/.netlify/functions/reserver', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom_loueur: info.nom,
        adresse: info.adresse,
        cp: info.cp,
        ville: info.ville,
        email: info.email,
        telephone: info.tel,
        date_debut: info.debutISO,
        date_fin: info.finISO,
        articles: panier.map((i) => ({ id: Number(i.id), qty: Number(i.qty) })),
        pdf_base64: pdfBase64,
        website: document.getElementById('website').value
      })
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || 'La réservation a été refusée par le serveur.');

    const link = payload.contract_url
      ? `\n\nVotre contrat temporaire : ${payload.contract_url}`
      : '';
    alert(`Réservation enregistrée. Elle reste en attente de confirmation par l'OGEC.${link}`);
    window.location.reload();
  } catch (error) {
    console.error(error);
    alert(error.message || 'Erreur lors de la réservation.');
    button.disabled = false;
    button.textContent = 'Confirmer la réservation';
    await refreshDisponibilites();
  }
});

await fetchMateriels();
</script>
</body>
</html>

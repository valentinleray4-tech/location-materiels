<!DOCTYPE html>

<body class="bg-gray-100 min-h-screen">

<header class="bg-indigo-700 text-white shadow-md p-6">
<div class="container mx-auto flex justify-between items-center">
<div>

<p class="text-indigo-100 italic">Réservez, louez, aidez l'école !</p>
</div>
<div id="connectionStatus" class="text-xs bg-indigo-800 p-2 rounded text-indigo-200">

</header>

<main class="container mx-auto py-8 px-4 grid lg:grid-cols-3 gap-8">
<div class="lg:col-span-2 space-y-6">

</div>

<aside class="space-y-6">
<div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500 sticky top-6">

<div id="panierList" class="space-y-3 mb-6 max-h-60 overflow-y-auto border-b pb-4">

</div>

<div class="space-y-2 mb-6">
<div class="flex justify-between text-gray-600">
<span>Total Location :</span>
<span id="totalPrix" class="font-bold">0.00 €</span>
</div>
<div class="flex justify-between text-orange-600 bg-orange-50 p-2 rounded">
<span class="text-sm">Caution à prévoir :</span>
<span id="totalCaution" class="font-bold">0.00 €</span>
</div>
</div>

<div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
<h3 class="font-bold text-gray-700 mb-3 text-sm flex items-center">
<i class="fas fa-user-edit mr-2 text-indigo-500"></i> Informations de location
</h3>
<div class="grid grid-cols-1 gap-3">
<input type="text" id="nom_loueur" placeholder="Nom et Prénom du loueur" class="p-2 border rounded text-sm w-full outline-none">
<div class="grid grid-cols-2 gap-2">
<input type="email" id="email_loueur" placeholder="Adresse email" class="p-2 border rounded text-sm outline-none">
<input type="tel" id="tel_loueur" placeholder="Téléphone" class="p-2 border rounded text-sm outline-none">
</div>
<div class="grid grid-cols-2 gap-2">
<div class="flex flex-col">
<label class="text-[10px] font-bold text-gray-400 uppercase">Début</label>
<input type="date" id="date_debut" class="p-2 border rounded text-sm outline-none">
</div>
<div class="flex flex-col">
<label class="text-[10px] font-bold text-gray-400 uppercase">Fin</label>

</div>
</div>

<button id="btnSubmit" onclick="confirmerReservation()" class="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 shadow-lg transition transform active:scale-95">
Confirmer la réservation
</button>
</div>

</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const SUPABASE_URL = 'https://uofkzlgqryxhjaovidqf.supabase.co' 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZmt6bGdxcnl4aGphb3ZpZHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzUzNzAsImV4cCI6MjA5MzA1MTM3MH0.PO7vsGf8IfgnhRvegxfrCMDrYU5qhcBW8C789RCq0i8'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

// INITIALISATION EMAILJS - METS TA CLÉ PUBLIQUE ICI 
    emailjs.init("nOykns8pFjxSLoS1s"); 

let panier = [];
let itemsData = [];

// Chargement de l'inventaire
async function fetchMateriels() {
    try {
        const { data, error } = await supabase.from('materiels').select('*');
        if (error) throw error;
        itemsData = data;
        
        // C'est ici que l'on dessine l'inventaire (initialement bloqué)
        renderInventory(); 
        
        document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-check-circle text-green-400"></i> Connecté';
    } catch (err) {
        document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-exclamation-triangle text-red-400"></i> Erreur';
    }
}
// Ajoutez ceci juste après la fonction fetchMateriels
document.getElementById('date_debut').addEventListener('change', renderInventory);
document.getElementById('date_fin').addEventListener('change', renderInventory);
    
 async function calculerStockDisponible(materielId, stockTotal) {
    const debut = document.getElementById('date_debut').value;
    const fin = document.getElementById('date_fin').value;

    if (!debut || !fin) return stockTotal;

    // On récupère les réservations qui chevauchent ces dates
    const { data: reservations, error } = await supabase
        .from('reservations')
        .select('articles')
        .lte('date_debut', fin)
        .gte('date_fin', debut);

    if (error) {
        console.error("Erreur calcul stock:", error);
        return stockTotal;
    }

    // Calcul de la somme déjà réservée
    let dejaLoue = 0;
    reservations.forEach(res => {
        const art = res.articles.find(a => a.id === materielId);
        if (art) dejaLoue += art.qty;
    });

    return stockTotal - dejaLoue;
}   
async function renderInventory() {
    const container = document.getElementById('inventory');
    const dateDebut = document.getElementById('date_debut').value;
    const dateFin = document.getElementById('date_fin').value;
    const datesRemplies = dateDebut !== "" && dateFin !== "";

    // Calcul des stocks pour chaque item
    const itemsWithStock = await Promise.all(itemsData.map(async (item) => {
        const stockDispo = datesRemplies 
            ? await calculerStockDisponible(item.id, item.stock_total) 
            : item.stock_total;
        return { ...item, stockDispo };
    }));

    container.innerHTML = itemsWithStock.map(item => {
        // Détermination de l'état de l'article
        const estIndisponible = datesRemplies && item.stockDispo <= 0;
        
        // Choix de la couleur et du texte du badge principal
        let badgeColor = "bg-green-500";
        let badgeText = `STOCK TOTAL : ${item.stock_total}`;
        
        if (datesRemplies) {
            if (estIndisponible) {
                badgeColor = "bg-red-600";
                badgeText = "INDISPONIBLE";
            } else {
                badgeColor = "bg-blue-600";
                badgeText = `DISPONIBLE : ${item.stockDispo}`;
            }
        }

        return `
        <div class="border rounded-lg overflow-hidden flex flex-col bg-white shadow-sm ${estIndisponible ? 'opacity-75' : ''}">
            <div class="h-40 bg-gray-100 relative">
                <img src="${item.image_url || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover ${estIndisponible ? 'grayscale' : ''}">
                
                <!-- Zone des Badges -->
                <div class="absolute top-2 right-2 flex flex-col items-end gap-1">
                    <span class="${badgeColor} text-white text-[10px] px-2 py-1 rounded font-bold uppercase shadow-md transition-colors">
                        ${badgeText}
                    </span>
                    ${datesRemplies && !estIndisponible ? `
                        <span class="bg-blue-100 text-blue-700 text-[9px] px-2 py-0.5 rounded font-bold uppercase border border-blue-200">
                            <i class="fas fa-calendar-check"></i> Dispo vérifiée
                        </span>
                    ` : ''}
                </div>
            </div>
            <div class="p-4 flex flex-col justify-between flex-grow">
                <div>
                    <h3 class="font-bold text-gray-800">${item.nom}</h3>
                    <p class="text-indigo-600 font-bold">${item.prix.toFixed(2)} €</p>
                </div>
                <div class="mt-4 flex gap-2">
                    <input type="number" id="qty-${item.id}" min="1" max="${item.stockDispo}" value="1" 
                        ${!datesRemplies || estIndisponible ? 'disabled' : ''} 
                        class="w-12 border rounded text-center text-sm ${estIndisponible ? 'bg-gray-100' : ''}">
                    
                    <button onclick="ajouterAuPanier(${item.id})" 
                        ${!datesRemplies || estIndisponible ? 'disabled' : ''} 
                        class="flex-1 text-white text-xs py-2 rounded font-bold transition-colors ${
                            !datesRemplies ? 'bg-gray-400 cursor-not-allowed' : 
                            (estIndisponible ? 'bg-red-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700')
                        }">
                        ${!datesRemplies ? 'Saisir dates' : (estIndisponible ? 'Indisponible' : 'Ajouter')}
                    </button>
                </div>
            </div>
        </div>
        `;
    }).join('');
}

window.ajouterAuPanier = async (id) => {
    const item = itemsData.find(i => i.id === id);
    const qtyDemandee = parseInt(document.getElementById(`qty-${id}`).value);
    
    // VERIFICATION DYNAMIQUE AVANT AJOUT
    const stockReel = await calculerStockDisponible(id, item.stock_total);

    if (qtyDemandee > stockReel) {
        alert(`Désolé ! Pour ces dates, il ne reste que ${stockReel} exemplaire(s) de "${item.nom}".`);
        return;
    }

    const index = panier.findIndex(p => p.id === id);
    if (index > -1) {
        if (panier[index].qty + qtyDemandee > stockReel) {
            alert("Limite de stock atteinte pour cette période avec vos articles déjà au panier.");
            return;
        }
        panier[index].qty += qtyDemandee;
    } else {
        panier.push({ ...item, qty: qtyDemandee });
    }
    majPanier();
};

window.supprimerItem = (index) => { panier.splice(index, 1); majPanier(); };

function majPanier() {
const container = document.getElementById('panierList');
let totalP = 0, totalC = 0;
container.innerHTML = panier.map((item, index) => {
totalP += (item.qty * item.prix);
totalC += (item.qty * (item.caution_unitaire || 0));
return `<div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded">
               <span>${item.qty}x ${item.nom}</span>
               <button onclick="supprimerItem(${index})" class="text-red-400"><i class="fas fa-times"></i></button>
           </div>`;
}).join('');
document.getElementById('totalPrix').innerText = totalP.toFixed(2) + " €";
document.getElementById('totalCaution').innerText = totalC.toFixed(2) + " €";
}

window.confirmerReservation = async () => {
const btn = document.getElementById('btnSubmit');
const info = {

tel: document.getElementById('tel_loueur').value,
debut: document.getElementById('date_debut').value,
fin: document.getElementById('date_fin').value,
totalP: document.getElementById('totalPrix').innerText,
totalC: document.getElementById('totalCaution').innerText
};

if (!info.nom || !info.email || panier.length === 0) return alert("Veuillez remplir toutes les informations.");

btn.disabled = true;
btn.innerText = "Génération et envoi en cours...";

const docDefinition = {
pageSize: 'A4',

content: [
{ text: 'CONTRAT DE LOCATION - ECOLE SAINTE ANNE CASSON', style: 'mainTitle' },

{ text: '\n' },
{

{ width: '*', stack: ['OGEC SERVICE LOCATION', 'ECOLE SAINTE ANNE', '2 Rue du château', '44390 CASSON', 'location.ecolesteanne@gmail.com'], fontSize: 9 },

]
},

{ text: `Date de départ : ${info.debut}       Date de retour : ${info.fin}`, margin: [10, 5, 0, 15], fontSize: 10 },
{ text: '2- Matériels loués :', style: 'sectionHeader' },
{

body: [
[{text:'Articles', style:'tableHeader'}, {text:'Quantités', style:'tableHeader', alignment:'center'}, {text:'Caution/u', style:'tableHeader', alignment:'right'}, {text:'Prix Total', style:'tableHeader', alignment:'right'}],
...panier.map(i => [i.nom, i.qty.toString(), `${(i.caution_unitaire || 0).toFixed(2)} €`, `${(i.qty * i.prix).toFixed(2)} €`])

{ text: '\n' },
{

], padding: [10, 10, 10, 10]

}
},
{ text: '\n4- Etat du matériel:', style: 'sectionHeader' },

{ canvas: [{ type: 'rect', x: 0, y: 5, w: 515, h: 40, lineWidth: 0.5, lineColor: '#ccc' }] },
{ text: '\n5- Conditions:', style: 'sectionHeader' },
{
ul: [
{ text: 'Une caution sera demandée lors de la remise du matériel.', fontSize: 8 },
{ text: 'La caution ne sera pas encaissée sauf en cas de détérioration, perte ou non-restitution du matériel. Dans ce cas, tout ou partie de la caution pourra être conservée afin de couvrir les frais de réparation ou de remplacement.', fontSize: 8 },
{ text: 'Le locataire est responsable du matériel pendant toute la durée de la location, depuis sa prise en charge jusqu\'à sa restitution.', fontSize: 8 },
{ text: 'Le matériel devra être restitué complet, propre et en bon état. Toute anomalie constatée pourra entraîner l\'application de retenues sur la caution.', fontSize: 8 }
], margin: [0, 5, 0, 10]
},
{ text: 'CE CONTRAT NE FAIT FOI QU\'APRÈS CONFIRMATION PAR MAIL OU TÉLÉPHONE DE LA PART DE L\'OGEC', alignment: 'center', bold: true, fontSize: 10, margin: [0, 15, 0, 20] },
{
columns: [
{ stack: [{ text: 'Signature OGEC :', decoration: 'underline', fontSize: 10 }, { text: '\n\n' }] },
{ stack: [{ text: 'Signature loueur :', decoration: 'underline', fontSize: 10, alignment: 'right' }, { text: '\n\n' }] }
]
}
],
styles: {
mainTitle: { fontSize: 14, bold: true, alignment: 'center' },
sectionHeader: { fontSize: 11, bold: true, background: '#e5e7eb', margin: [0, 15, 0, 5] },
tableHeader: { fontSize: 9, bold: true, fillColor: '#f3f4f6' }
}
};

try {
const pdfDocGenerator = pdfMake.createPdf(docDefinition);

// ... (reste du code identique au-dessus)

pdfDocGenerator.getBlob(async (blob) => {
    const fileName = `contrat_${Date.now()}_${info.nom.replace(/\s/g, '_')}.pdf`;
    
    // 1. UPLOAD DANS LE STORAGE
    const { data: uploadData, error: uploadError } = await supabase.storage

        .upload(fileName, blob, { contentType: 'application/pdf' });

    if (uploadError) throw uploadError;

    // 2. RÉCUPÉRATION DU LIEN PUBLIC
    const { data: urlData } = supabase.storage
        .from('contrats')
        .getPublicUrl(fileName);
    
   const publicUrl = urlData.publicUrl;

    // 1. Préparation de la liste d'articles pour le mail (HTML)
    const listeArticlesHtml = panier.map(i => `<li>${i.qty}x ${i.nom}</li>`).join('');

    // 2. ENREGISTREMENT DANS LA TABLE RESERVATIONS
    const { error: dbError } = await supabase
        .from('reservations')
        .insert([{
            nom_loueur: info.nom,
            email: info.email,       // Doit correspondre à ta colonne 'email'
            telephone: info.tel,     // Doit correspondre à ta colonne 'telephone'
            date_debut: info.debut,
            date_fin: info.fin,
            total_prix: parseFloat(info.totalP), 
            total_caution: parseFloat(info.totalC),
            pdf_url: publicUrl,
            articles: panier,        // On envoie directement l'objet JSON ici

        }]);

    if (dbError) console.error("Erreur DB:", dbError);
// --- DÉBUT ALERTE ADMIN MAKE CORRIGÉ ---
const part1 = "https://hook.eu1.make.com/";
const part2 = "apcapqrfu7fv7rqab0xp428aak6xtu4o";

}).catch(err => console.log("Erreur envoi alerte Make:", err));

        nom_loueur: info.nom,

        // On remplit la variable message_html avec la liste
        message_html: `
            <p>Nouvelle réservation de <strong>${info.nom}</strong>.</p>
            <p><strong>Articles loués :</strong></p>
            <ul>${listeArticlesHtml}</ul>
            <p><strong>Total :</strong> ${info.totalP} (Caution: ${info.totalC})</p>
            <p>Lien du contrat : <a href="${publicUrl}" target="_blank">Cliquez ici pour voir le PDF</a></p>
        `
    });
    pdfDocGenerator.download(fileName);
    alert("Réussite ! La réservation est enregistrée en base de données et le mail est envoyé.");
    window.location.reload();
});
} catch (err) {
        console.error(err);
        alert("Erreur lors de la réservation.");
        btn.disabled = false;

};

fetchMateriels();
</script>

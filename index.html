<html lang="fr">
<head>

            emailjs.init("nOykns8pFjxSLoS1s");
        })();
    </script>
</head>

<body class="bg-gray-100">

<header class="bg-indigo-700 text-white shadow-md p-6">
    <div class="container mx-auto">
        <h1 class="text-2xl font-bold text-center">Loc'APEL école St Anne-Casson</h1>

<main class="container mx-auto py-8 px-4 grid lg:grid-cols-3 gap-8">

    <!-- Catalogue -->
    <div class="lg:col-span-2">

</main>

<!-- PDF -->
<div class="container mx-auto my-10 p-5 bg-white border max-w-4xl">
    <div id="pdf-render-zone" style="width:750px;margin:auto;padding:40px;"></div>
</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
    'https://uofkzlgqryxhjaovidqf.supabase.co',
    'sb_publishable_3yWGD_MoqP-6jHeHbbIM5w_kphGAJ2F'
);

let panier = [];
let itemsData = [];

/* ------------------ DATA ------------------ */

async function fetchMateriels() {
    const { data } = await supabase.from('materiels').select('*');
    itemsData = data || [];
    renderInventory();
    majContratVisuel();
}

/* ------------------ INVENTAIRE ------------------ */

function renderInventory() {
    document.getElementById('inventory').innerHTML = itemsData.map(item => {

        const qte = panier.find(p => p.id === item.id)?.qty || 0;
        const stock = (item.stock || 0) - qte;

        return `
        <div class="border rounded-xl bg-white shadow-sm p-4">
            <img src="${item.image_url}" class="h-40 w-full object-cover mb-2">
            <div class="flex justify-between font-bold">
                <span>${item.nom}</span>
                <span>${item.prix}€</span>
            </div>
            <p class="text-xs text-gray-500">Stock : ${stock}</p>

            <div class="flex gap-2 mt-2">
                <input type="number" id="qty-${item.id}" value="1" min="1" max="${stock}" class="w-12 border text-center">
                <button onclick="ajouterAuPanier(${item.id})" class="flex-1 bg-indigo-600 text-white py-1 rounded">Ajouter</button>
            </div>
        </div>
        `;
    }).join('');
}

/* ------------------ PANIER ------------------ */

window.ajouterAuPanier = (id) => {
    const item = itemsData.find(i => i.id === id);
    const qty = parseInt(document.getElementById(`qty-${id}`).value);

    const index = panier.findIndex(p => p.id === id);

    if (index > -1) panier[index].qty += qty;
    else panier.push({ ...item, qty });

    renderInventory();
    majContratVisuel();
}

window.retirer = (id) => {
    panier = panier.filter(p => p.id !== id);
    renderInventory();
    majContratVisuel();
}

/* ------------------ CONTRAT ------------------ */

function majContratVisuel() {

    let total = 0;
    let caution = 0;

    const list = document.getElementById('panierList');

    list.innerHTML = panier.length === 0 ? "Vide" :
        panier.map(item => {
            total += item.qty * item.prix;
            caution += item.qty * (item.caution_unitaire || 0);
            return `<div>${item.qty}x ${item.nom}</div>`;
        }).join('');

    document.getElementById('totalPrix').innerText = total.toFixed(2) + " €";
    document.getElementById('totalCaution').innerText = caution.toFixed(2) + " €";

    document.getElementById('pdf-render-zone').innerHTML = `
        <h2 style="text-align:center">CONTRAT DE LOCATION</h2>
        <p>Nom : ${document.getElementById('nom_loueur').value}</p>
        <p>Total : ${total.toFixed(2)} €</p>
    `;
}

/* ------------------ CONFIRMATION ------------------ */

window.confirmerReservation = async () => {

    const btn = document.getElementById('btnSubmit');
    const nom = document.getElementById('nom_loueur').value;

    if (!nom || panier.length === 0) {
        alert("Veuillez remplir votre nom et choisir du matériel.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Génération...";

    const element = document.getElementById('pdf-render-zone');

    const opt = {
        margin: 10,
        filename: `Contrat_${nom}.pdf`,
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4' }
    };

    try {

        await new Promise(r => setTimeout(r, 300));

        const worker = html2pdf().set(opt).from(element);
        const blob = await worker.output('blob');

        /* téléchargement */
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Contrat_${nom}.pdf`;
        a.click();
        URL.revokeObjectURL(url);

        /* upload */
        const path = `contrats/${Date.now()}_${nom}.pdf`;

        await supabase.storage.from('contrats').upload(path, blob, {
            contentType: 'application/pdf'
        });

        const { data } = supabase.storage.from('contrats').getPublicUrl(path);

        /* email */
        await emailjs.send('service_63g35od', 'template_gb5d2wt', {
            nom_loueur: nom,
            email_destinataire: document.getElementById('email_loueur').value,
            lien_pdf: data.publicUrl
        });

        alert("Réservation OK !");
        window.location.reload();

    } catch (e) {
        console.error(e);
        alert("Erreur PDF");
        btn.disabled = false;
    }
};

fetchMateriels();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loc'APE - Gestion des Locations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <!-- AJOUT DE LA BIBLIOTHEQUE EMAILJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-indigo-700 text-white shadow-md p-6">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Loc'APEL école St Anne-Casson</h1>
                <p class="text-indigo-100 italic">Réservez, louez, aidez l'école !</p>
            </div>
            <div id="connectionStatus" class="text-xs bg-indigo-800 p-2 rounded text-indigo-200">
                <i class="fas fa-database mr-1"></i> Connexion base de données...
            </div>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4 grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm min-h-[400px]">
                <h2 class="text-xl font-bold mb-6 text-gray-800 border-b pb-2">Inventaire disponible</h2>
                <div class="grid md:grid-cols-2 gap-6" id="inventory">
                    <p class="text-gray-400">Chargement du matériel...</p>
                </div>
            </div>
        </div>

        <aside class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-indigo-500 sticky top-6">
                <h2 class="text-xl font-bold mb-4">Récapitulatif</h2>
                
                <div id="panierList" class="space-y-3 mb-6 max-h-60 overflow-y-auto border-b pb-4">
                    <p class="text-gray-400 italic text-center">Aucun article sélectionné</p>
                </div>

                <div class="space-y-2 mb-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Total Location :</span>
                        <span id="totalPrix" class="font-bold">0.00 €</span>
                    </div>
                    <div class="flex justify-between text-orange-600 bg-orange-50 p-2 rounded">
                        <span class="text-sm">Caution à prévoir :</span>
                        <span id="totalCaution" class="font-bold">0.00 €</span>
                    </div>
                </div>

                <div class="mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-3 text-sm flex items-center">
                        <i class="fas fa-user-edit mr-2 text-indigo-500"></i> Informations de location
                    </h3>
                    <div class="grid grid-cols-1 gap-3">
                        <input type="text" id="nom_loueur" placeholder="Nom et Prénom du loueur" class="p-2 border rounded text-sm w-full outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="email" id="email_loueur" placeholder="Adresse email" class="p-2 border rounded text-sm outline-none">
                            <input type="tel" id="tel_loueur" placeholder="Téléphone" class="p-2 border rounded text-sm outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="flex flex-col">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Début</label>
                                <input type="date" id="date_debut" class="p-2 border rounded text-sm outline-none">
                            </div>
                            <div class="flex flex-col">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Fin</label>
                                <input type="date" id="date_fin" class="p-2 border rounded text-sm outline-none">
                            </div>
                        </div>
                    </div>
                </div>

                <button id="btnSubmit" onclick="confirmerReservation()" class="w-full mt-6 bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 shadow-lg transition transform active:scale-95">
                    Confirmer la réservation
                </button>
            </div>
        </aside>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://uofkzlgqryxhjaovidqf.supabase.co' 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvZmt6bGdxcnl4aGphb3ZpZHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NzUzNzAsImV4cCI6MjA5MzA1MTM3MH0.PO7vsGf8IfgnhRvegxfrCMDrYU5qhcBW8C789RCq0i8'
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        // INITIALISATION EMAILJS (Public Key)
        emailjs.init("nOykns8pFjxSLoS1s"); // <--- REMPLACE PAR TA CLE PUBLIQUE EMAILJS

        let panier = [];
        let itemsData = [];

        async function fetchMateriels() {
            try {
                const { data, error } = await supabase.from('materiels').select('*');
                if (error) throw error;
                itemsData = data;
                renderInventory();
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-check-circle text-green-400"></i> Connecté';
            } catch (err) {
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-exclamation-triangle text-red-400"></i> Erreur';
            }
        }

        function renderInventory() {
            const container = document.getElementById('inventory');
            container.innerHTML = itemsData.map(item => `
                <div class="border rounded-lg overflow-hidden flex flex-col bg-white shadow-sm">
                    <div class="h-40 bg-gray-100 relative">
                        <img src="${item.image_url || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-green-500 text-white text-[10px] px-2 py-1 rounded font-bold uppercase">Stock : ${item.stock_total}</span>
                    </div>
                    <div class="p-4 flex flex-col justify-between flex-grow">
                        <div>
                            <h3 class="font-bold text-gray-800">${item.nom}</h3>
                            <p class="text-indigo-600 font-bold">${item.prix.toFixed(2)} €</p>
                        </div>
                        <div class="mt-4 flex gap-2">
                            <input type="number" id="qty-${item.id}" min="1" max="${item.stock_total}" value="1" class="w-12 border rounded text-center text-sm">
                            <button onclick="ajouterAuPanier(${item.id})" class="flex-1 bg-indigo-600 text-white text-xs py-2 rounded font-bold">Ajouter</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.ajouterAuPanier = (id) => {
            const item = itemsData.find(i => i.id === id);
            const qty = parseInt(document.getElementById(`qty-${id}`).value);
            const index = panier.findIndex(p => p.id === id);
            if (index > -1) panier[index].qty += qty;
            else panier.push({ ...item, qty: qty });
            majPanier();
        };

        window.supprimerItem = (index) => { panier.splice(index, 1); majPanier(); };

        function majPanier() {
            const container = document.getElementById('panierList');
            let totalP = 0, totalC = 0;
            container.innerHTML = panier.map((item, index) => {
                totalP += (item.qty * item.prix);
                totalC += (item.qty * (item.caution_unitaire || 0));
                return `<div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded">
                    <span>${item.qty}x ${item.nom}</span>
                    <button onclick="supprimerItem(${index})" class="text-red-400"><i class="fas fa-times"></i></button>
                </div>`;
            }).join('');
            document.getElementById('totalPrix').innerText = totalP.toFixed(2) + " €";
            document.getElementById('totalCaution').innerText = totalC.toFixed(2) + " €";
        }

        window.confirmerReservation = async () => {
            const btn = document.getElementById('btnSubmit');
            const info = {
                nom: document.getElementById('nom_loueur').value,
                email: document.getElementById('email_loueur').value,
                tel: document.getElementById('tel_loueur').value,
                debut: document.getElementById('date_debut').value,
                fin: document.getElementById('date_fin').value,
                totalP: document.getElementById('totalPrix').innerText,
                totalC: document.getElementById('totalCaution').innerText
            };

            if (!info.nom || !info.email || panier.length === 0) return alert("Infos manquantes");

            btn.disabled = true;
            btn.innerText = "Traitement...";

            const docDefinition = {
                content: [
                    { text: 'CONTRAT DE LOCATION - ECOLE SAINTE ANNE CASSON', style: 'header' },
                    { text: '\n' },
                    {
                        columns: [
                            { stack: ['OGEC SERVICE LOCATION', 'ECOLE SAINTE ANNE', '2 Rue du château', '44390 CASSON'], fontSize: 9 },
                            { stack: [info.nom, `Tél: ${info.tel}`, `Mail: ${info.email}`], alignment: 'right', fontSize: 9 }
                        ]
                    },
                    { text: '\n1- Date de Location:', style: 'section' },
                    { text: `Départ: ${info.debut}   Retour: ${info.fin}`, fontSize: 10 },
                    { text: '\n2- Matériels loués :', style: 'section' },
                    {
                        table: {
                            headerRows: 1,
                            widths: ['*', 'auto', 'auto', 'auto'],
                            body: [
                                ['Article', 'Qté', 'Caution/u', 'Total'],
                                ...panier.map(i => [i.nom, i.qty, `${i.caution_unitaire}€`, `${(i.qty * i.prix).toFixed(2)}€`])
                            ]
                        }, layout: 'lightHorizontalLines'
                    },
                    { text: `\nTotal à régler : ${info.totalP}`, bold: true },
                    { text: `Total caution : ${info.totalC}`, bold: true, color: 'red' },
                    { text: '\n5- Conditions:', style: 'section' },
                    { text: 'La caution ne sera pas encaissée sauf dégradation. Le matériel doit être rendu propre.', fontSize: 8 },
                    { text: '\n\nSignatures :', margin: [0, 20] },
                    { columns: [{ text: 'OGEC' }, { text: 'Le Loueur', alignment: 'right' }] }
                ],
                styles: {
                    header: { fontSize: 14, bold: true, alignment: 'center' },
                    section: { fontSize: 11, bold: true, background: '#eeeeee', margin: [0, 10, 0, 5] }
                }
            };

            try {
                const pdfDoc = pdfMake.createPdf(docDefinition);
                pdfDoc.download(`Contrat_${info.nom}.pdf`);

                // Envoi EmailJS
                await emailjs.send('service_63g35od', 'template_gb5d2wt', {
                    nom_loueur: info.nom,
                    email_destinataire: info.email,
                    message_html: `Réservation de ${info.nom}. Total: ${info.totalP}. Caution: ${info.totalC}`
                });

                alert("Réservation réussie !");
                window.location.reload();
            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'envoi");
                btn.disabled = false;
            }
        };

        fetchMateriels();
    </script>
</body>
</html>

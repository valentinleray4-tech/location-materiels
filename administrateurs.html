<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loc'APEL - Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto p-4 md:p-6">
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-6 border-b pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800">Administration Loc'APEL</h1>
        <p class="text-sm text-gray-500">Réservations, contrats et calendrier</p>
      </div>
      <div id="sessionBox" class="hidden items-center gap-2">
        <span id="adminEmail" class="text-xs text-gray-500"></span>
        <button id="logoutBtn" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-2 rounded font-bold">Déconnexion</button>
      </div>
    </header>

    <section id="loginPanel" class="max-w-md mx-auto bg-white rounded-xl shadow p-6 border border-gray-200">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Connexion administrateur</h2>
      <p class="text-sm text-gray-500 mb-4">Utilisez votre compte administrateur autorisé.</p>
      <form id="loginForm" class="space-y-3">
        <input id="email" type="email" autocomplete="username" required placeholder="Adresse e-mail" class="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-300">
        <input id="password" type="password" autocomplete="current-password" required placeholder="Mot de passe" class="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-300">
        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg py-3">Se connecter</button>
      </form>
      <p id="loginError" class="hidden mt-3 text-sm text-red-600"></p>
    </section>

    <main id="dashboard" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
      <section class="lg:col-span-2">
        <h2 class="text-xl font-bold mb-3 text-gray-700">Calendrier</h2>
        <div id="calendar" class="bg-white rounded-xl shadow p-3 md:p-5"></div>
      </section>
      <section>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xl font-bold text-gray-700">Demandes</h2>
          <button id="refreshBtn" class="text-xs bg-white border px-3 py-2 rounded-lg hover:bg-gray-50"><i class="fas fa-rotate"></i> Actualiser</button>
        </div>
        <div id="list" class="space-y-4 lg:max-h-[760px] lg:overflow-y-auto"></div>
      </section>
    </main>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
  'https://uofkzlgqryxhjaovidqf.supabase.co',
  'sb_publishable_3yWGD_MoqP-6jHeHbbIM5w_kphGAJ2F'
);

const loginPanel = document.getElementById('loginPanel');
const dashboard = document.getElementById('dashboard');
const loginError = document.getElementById('loginError');
const sessionBox = document.getElementById('sessionBox');
const adminEmail = document.getElementById('adminEmail');
const list = document.getElementById('list');
let calendar;
let reservations = [];

const escapeHtml = (value) => String(value ?? '')
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#039;');

async function getToken() {
  const { data } = await supabase.auth.getSession();
  return data.session?.access_token || null;
}

async function api(path, options = {}) {
  const token = await getToken();
  if (!token) throw new Error('Session expirée.');
  const response = await fetch(path, {
    ...options,
    headers: {
      ...(options.headers || {}),
      'Authorization': `Bearer ${token}`,
      ...(options.body ? { 'Content-Type': 'application/json' } : {})
    }
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || 'Erreur serveur.');
  return payload;
}

function setLoggedIn(user) {
  const logged = !!user;
  loginPanel.classList.toggle('hidden', logged);
  dashboard.classList.toggle('hidden', !logged);
  sessionBox.classList.toggle('hidden', !logged);
  sessionBox.classList.toggle('flex', logged);
  adminEmail.textContent = user?.email || '';
}

function statusClasses(statut) {
  if (statut === 'Confirmé') return ['bg-green-100 text-green-800', 'border-green-500'];
  if (statut === 'Refusé') return ['bg-red-100 text-red-800', 'border-red-500'];
  return ['bg-orange-100 text-orange-800', 'border-orange-500'];
}

function renderList() {
  if (!reservations.length) {
    list.innerHTML = '<div class="bg-white p-4 rounded-lg text-sm text-gray-500">Aucune réservation.</div>';
    return;
  }

  list.innerHTML = reservations.map((r) => {
    const [badge, border] = statusClasses(r.statut);
    const articles = Array.isArray(r.articles) ? r.articles : [];
    return `
      <article class="bg-white p-4 rounded-xl shadow border-l-4 ${border}">
        <div class="flex justify-between gap-3 items-start">
          <div>
            <strong class="text-base block text-gray-800">${escapeHtml(r.nom_loueur)}</strong>
            <span class="${badge} text-[10px] font-bold px-2 py-0.5 rounded uppercase">${escapeHtml(r.statut || 'En attente')}</span>
          </div>
          <span class="text-[10px] font-semibold text-gray-500 bg-gray-100 px-2 py-1 rounded">${escapeHtml(r.date_debut)} → ${escapeHtml(r.date_fin)}</span>
        </div>
        <div class="text-xs text-gray-600 mt-3 bg-gray-50 p-2 rounded">
          ${articles.map((a) => `<div>${escapeHtml(a.qty)}x ${escapeHtml(a.nom)}</div>`).join('') || '<em>Aucun article</em>'}
        </div>
        <div class="mt-3 text-xs text-gray-500 space-y-1">
          <div>${escapeHtml(r.email || '')}</div>
          <div>${escapeHtml(r.telephone || '')}</div>
          <div><strong>Total :</strong> ${Number(r.total_prix || 0).toFixed(2)} €</div>
        </div>
        <div class="mt-4 pt-3 border-t space-y-2">
          <button data-contract="${r.id}" class="w-full text-xs font-bold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 py-2 rounded">Ouvrir le contrat</button>
          <div class="grid grid-cols-2 gap-2">
            <button data-status="Confirmé" data-id="${r.id}" class="py-2 bg-green-500 hover:bg-green-600 text-white rounded text-xs font-bold">Valider</button>
            <button data-status="Refusé" data-id="${r.id}" class="py-2 bg-red-500 hover:bg-red-600 text-white rounded text-xs font-bold">Refuser</button>
          </div>
          <div class="text-[9px] text-gray-400 italic">${r.valide_par ? `Traité par : ${escapeHtml(r.valide_par)}` : 'Non traité'}</div>
        </div>
      </article>`;
  }).join('');
}

function renderCalendar() {
  if (calendar) calendar.destroy();
  calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    locale: 'fr',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
    events: reservations.map((r) => ({
      title: `${r.nom_loueur} (${r.statut || 'Attente'})`,
      start: r.date_debut,
      end: r.date_fin,
      backgroundColor: r.statut === 'Confirmé' ? '#10b981' : r.statut === 'Refusé' ? '#ef4444' : '#f59e0b',
      borderColor: 'transparent'
    }))
  });
  calendar.render();
}

async function loadReservations() {
  list.innerHTML = '<div class="bg-white p-4 rounded-lg text-sm text-gray-500">Chargement…</div>';
  const payload = await api('/.netlify/functions/admin-reservations');
  reservations = payload.reservations || [];
  renderList();
  renderCalendar();
}

document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  loginError.classList.add('hidden');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    loginError.textContent = 'Connexion refusée.';
    loginError.classList.remove('hidden');
    return;
  }
  setLoggedIn(data.user);
  try {
    await loadReservations();
  } catch (err) {
    await supabase.auth.signOut();
    setLoggedIn(null);
    loginError.textContent = err.message;
    loginError.classList.remove('hidden');
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  setLoggedIn(null);
});

document.getElementById('refreshBtn').addEventListener('click', () => loadReservations().catch((e) => alert(e.message)));

list.addEventListener('click', async (event) => {
  const statusButton = event.target.closest('[data-status]');
  if (statusButton) {
    statusButton.disabled = true;
    try {
      await api('/.netlify/functions/admin-statut', {
        method: 'POST',
        body: JSON.stringify({ id: Number(statusButton.dataset.id), statut: statusButton.dataset.status })
      });
      await loadReservations();
    } catch (err) {
      alert(err.message);
      statusButton.disabled = false;
    }
    return;
  }

  const contractButton = event.target.closest('[data-contract]');
  if (contractButton) {
    try {
      const payload = await api(`/.netlify/functions/admin-contrat?id=${encodeURIComponent(contractButton.dataset.contract)}`);
      window.open(payload.url, '_blank', 'noopener,noreferrer');
    } catch (err) {
      alert(err.message);
    }
  }
});

const { data: initial } = await supabase.auth.getSession();
if (initial.session?.user) {
  setLoggedIn(initial.session.user);
  loadReservations().catch(async (err) => {
    alert(err.message);
    await supabase.auth.signOut();
    setLoggedIn(null);
  });
} else {
  setLoggedIn(null);
}
</script>
</body>
</html>
